<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acısu United | Yönetim</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{bordo:"#5c1a21",altin:"#c1a57b"},fontFamily:{sans:["Montserrat","sans-serif"],baslik:["Oswald","sans-serif"]}}}}</script>
  <style>body{background:#0a0a0a;color:#fff}input,select,textarea{background:#191315!important;border:1px solid #75545a!important;border-radius:8px;padding:10px;color:white;width:100%}button{cursor:pointer}label{display:block;margin:8px 0;font-size:.9rem}.panel{background:#171013;border:1px solid #624147;border-radius:16px;padding:20px;margin-bottom:22px}.action{background:#5c1a21;padding:10px 16px;border-radius:8px;font-weight:700}.action:hover{background:#7a2933}.muted{color:#c9b8bb}</style>
</head>
<body class="font-sans">
  <main class="max-w-5xl mx-auto p-4 md:p-8">
    <header class="flex justify-between items-center mb-8 gap-3">
      <h1 class="font-baslik text-3xl text-altin">ACISU UNITED · YÖNETİM</h1>
      <a href="index.html" class="underline text-sm">Siteye dön</a>
    </header>
    <p id="notice" role="status" aria-live="polite" class="mb-4 muted"></p>
    <form id="login-form" class="panel max-w-md">
      <h2 class="text-xl font-bold mb-4">Admin girişi</h2>
      <label>E-posta<input type="email" name="email" required autocomplete="username"></label>
      <label>Şifre<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="action mt-3" type="submit">Giriş yap</button>
    </form>
    <div id="dashboard" hidden>
      <button id="logout" class="underline mb-6">Çıkış yap</button>
      <section class="panel">
        <h2 class="font-baslik text-2xl text-altin mb-3">Oyuncular</h2>
        <form id="player-form" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <input type="hidden" name="id">
          <label>Adı<input name="name" maxlength="100" required></label>
          <label>Forma no<input name="number" type="number" min="0" max="99" required></label>
          <label>Pozisyon<input name="position" maxlength="20" required></label>
          <label>Fotoğraf dosyası / HTTPS URL<input name="image_url" maxlength="500" placeholder="oyuncu.png"></label>
          <label>Genel<input name="rating" type="number" min="0" max="99" value="70" required></label>
          <label>Hız<input name="pace" type="number" min="0" max="99" value="70" required></label>
          <label>Pas<input name="passing" type="number" min="0" max="99" value="70" required></label>
          <label>Defans<input name="defense" type="number" min="0" max="99" value="70" required></label>
          <label class="flex items-center gap-2"><input name="active" type="checkbox" checked class="!w-auto"> Sitede göster</label>
          <div class="flex items-end gap-3"><button class="action" type="submit">Oyuncuyu kaydet</button><button type="reset" class="underline">Temizle</button></div>
        </form>
        <div id="players-list" class="mt-5"></div>
      </section>
      <section class="panel">
        <h2 class="font-baslik text-2xl text-altin mb-3">Maçlar ve sonuçlar</h2>
        <form id="match-form" class="grid sm:grid-cols-2 gap-3">
          <input type="hidden" name="id">
          <label>Rakip<input name="opponent" maxlength="100" required></label>
          <label>Tarih ve saat<input name="match_at" type="datetime-local" required></label>
          <label>Saha<input name="venue" maxlength="150"></label>
          <label>Ev/deplasman<select name="home"><option value="true">Ev sahibi</option><option value="false">Deplasman</option></select></label>
          <label class="flex items-center gap-2"><input name="played" type="checkbox" class="!w-auto"> Maç oynandı</label>
          <label class="flex items-center gap-2"><input name="published" type="checkbox" checked class="!w-auto"> Sitede yayımla</label>
          <label>Bizim skor<input name="our_score" type="number" min="0" max="99" placeholder="Oynandıysa gir"></label>
          <label>Rakip skor<input name="their_score" type="number" min="0" max="99" placeholder="Oynandıysa gir"></label>
          <label class="sm:col-span-2">Gol atanlar<input name="goal_scorers" maxlength="500" placeholder="Örn. Hamza 2, Yasir 1"></label>
          <div class="flex items-end gap-3"><button class="action" type="submit">Maçı kaydet</button><button type="reset" class="underline">Temizle</button></div>
        </form>
        <div id="matches-list" class="mt-5"></div>
      </section>
      <section class="panel">
        <h2 class="font-baslik text-2xl text-altin mb-3">Maç kadrosu</h2>
        <label>Maç seç<select id="lineup-match"></select></label>
        <p class="muted text-sm my-3">Her oyuncu için ilk kadro, yedek veya kadro dışı seç. Site, yaklaşan ilk maçın kadrosunu gösterir.</p>
        <div id="lineup-players" class="grid sm:grid-cols-2 gap-2"></div>
        <button id="save-lineup" class="action mt-4">Kadroyu kaydet</button>
      </section>
    </div>
  </main>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="admin.js?v=20260925-2"></script>
</body>
</html>
