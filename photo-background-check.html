<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Fotoğraf temizleme kontrolü</title><style>body{background:#211719;color:white;font:16px sans-serif;padding:20px}button{padding:12px;margin:8px}img{width:240px!important;height:300px!important;object-fit:contain}[hidden]{display:none!important}</style><h1>Fotoğraf temizleme kontrolü</h1><button id="sample" type="button">Örnek portreyi yükle</button><form id="player-form"><input name="id" value="test" type="hidden"><input name="image_url" type="hidden"><input name="photo" type="file" accept="image/*"><div><img id="photo-preview" hidden alt="Test fotoğrafı"></div><button type="submit">Test kaydı</button></form><p id="result"></p><script>const f=document.getElementById('player-form'),p=document.getElementById('photo-preview');f.addEventListener('submit',e=>{e.preventDefault();document.getElementById('result').textContent=f.elements.photo.files[0]?.type||'yok';});f.elements.photo.addEventListener('change',()=>{const file=f.elements.photo.files[0];p.src=file?URL.createObjectURL(file):'';p.hidden=!file;});document.getElementById('sample').onclick=async()=>{try{const r=await fetch('https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/portrait-of-woman_small.jpg');if(!r.ok)throw Error(r.status);const b=await r.blob(),d=new DataTransfer();d.items.add(new File([b],'sample.jpg',{type:'image/jpeg'}));f.elements.photo.files=d.files;f.elements.photo.dispatchEvent(new Event('change'));document.getElementById('result').textContent='Örnek yüklendi';}catch(e){document.getElementById('result').textContent=e.message;}};</script><script src="admin-photo-background.js?v=20260930-1"></script></html>
