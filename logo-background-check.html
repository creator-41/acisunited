<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Arma temizleme kontrolü</title><style>body{background:#211719;color:white;font:16px sans-serif;padding:20px}button{padding:12px;margin:6px}[hidden]{display:none!important}img{width:180px;height:180px;object-fit:contain}</style><h1>Rakip arması temizleme kontrolü</h1><button id="sample">Örnek armayı yükle</button><form id="match-form"><input name="id" type="hidden" value="test"><input name="opponent_image_url" type="hidden"><input name="opponent_photo" type="file"><div><img id="opponent-photo-preview" hidden alt="Örnek arma"></div><button type="submit">PNG kontrolü</button></form><p id="result"></p><script>const f=document.querySelector('form'),p=document.querySelector('img');f.elements.opponent_photo.addEventListener('change',()=>{p.src=URL.createObjectURL(f.elements.opponent_photo.files[0]);p.hidden=false;});document.getElementById('sample').onclick=()=>{const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,200,200);x.fillStyle='#5c1a21';x.beginPath();x.arc(100,100,65,0,Math.PI*2);x.fill();x.fillStyle='white';x.font='bold 60px sans-serif';x.textAlign='center';x.fillText('FK',100,120);c.toBlob(b=>{const d=new DataTransfer();d.items.add(new File([b],'arma.png',{type:'image/png'}));f.elements.opponent_photo.files=d.files;f.elements.opponent_photo.dispatchEvent(new Event('change'));},'image/png');};f.onsubmit=async e=>{e.preventDefault();const b=f.elements.opponent_photo.files[0],im=await createImageBitmap(b),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);document.getElementById('result').textContent=b.type+' · dış arka plan alfa: '+x.getImageData(0,0,1,1).data[3];};</script><script src="admin-photo-background.js?v=20260930-2"></script></html>
